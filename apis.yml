name: Bipar Sciences
description: 'BiPar Sciences was a Brisbane, California biopharmaceutical company developing
  a tumor-selective class of PARP (poly ADP-ribose polymerase) inhibitors for cancer therapy.
  Its lead candidate, BSI-201 (iniparib), was in mid-stage trials for advanced breast, ovarian,
  and other tumors. Backed by Canaan Partners, Vulcan Capital, PolyTechnos, Asset Management
  Company, and Quantum Technology Partners, BiPar was acquired by Sanofi-Aventis for roughly
  $500 million in April 2009 and no longer operates as an independent company. It was surfaced
  as a Canaan Partners portfolio company and added to the API Evangelist network as a stub;
  enrichment finds no public developer or API surface.'
